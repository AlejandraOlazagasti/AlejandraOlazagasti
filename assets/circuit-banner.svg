<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <style>
      /* Fuente del sistema para máxima compatibilidad en GitHub */
      .name { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; font-size: 44px; font-weight: 800; fill: #f0f6ff; letter-spacing: -1px; }
      .tagline { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; font-size: 16px; font-weight: 400; fill: #8b9dc3; letter-spacing: 3px; text-transform: uppercase; }
      .accent { fill: #2ee6d0; }

      /* Circuitos — pulse en secuencia */
      .circuit { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .c-teal { stroke: #2ee6d0; opacity: 0.25; }
      .c-gold  { stroke: #f5a200; opacity: 0.18; }

      .pulse-1 { stroke: #2ee6d0; opacity: 0; stroke-width: 1.5; fill: none; stroke-dasharray: 120 9999; stroke-dashoffset: 120; animation: trace 4s ease-out 0.3s infinite; }
      .pulse-2 { stroke: #2ee6d0; opacity: 0; stroke-width: 1.5; fill: none; stroke-dasharray: 80 9999;  stroke-dashoffset: 80;  animation: trace 4s ease-out 1.1s infinite; }
      .pulse-3 { stroke: #f5a200; opacity: 0; stroke-width: 1.2; fill: none; stroke-dasharray: 60 9999;  stroke-dashoffset: 60;  animation: trace 4s ease-out 2.0s infinite; }
      .pulse-4 { stroke: #2ee6d0; opacity: 0; stroke-width: 1.2; fill: none; stroke-dasharray: 90 9999;  stroke-dashoffset: 90;  animation: trace 4s ease-out 0.8s infinite; }
      .pulse-5 { stroke: #f5a200; opacity: 0; stroke-width: 1.5; fill: none; stroke-dasharray: 100 9999; stroke-dashoffset: 100; animation: trace 4s ease-out 1.6s infinite; }

      @keyframes trace {
        0%   { stroke-dashoffset: 120; opacity: 0; }
        5%   { opacity: 0.85; }
        80%  { opacity: 0.6; }
        100% { stroke-dashoffset: -600; opacity: 0; }
      }

      /* Nodos / vías que parpadean */
      .node { fill: #2ee6d0; animation: blink 3s ease-in-out infinite; }
      .node-g { fill: #f5a200; animation: blink 3s ease-in-out 1.4s infinite; }
      @keyframes blink { 0%,100% { opacity: 0.15; } 50% { opacity: 0.7; } }

      /* Fade-in del nombre */
      .hero-text { animation: fadein 1s ease-out 0.2s both; }
      @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

      /* Línea decorativa bajo el nombre */
      .underline-bar { stroke: url(#grad-line); stroke-width: 3; stroke-linecap: round; animation: grow 1.2s ease-out 0.6s both; transform-origin: left; }
      @keyframes grow { from { stroke-dasharray: 0 400; } to { stroke-dasharray: 260 400; } }
    </style>

    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0f1f2e"/>
    </linearGradient>
    <linearGradient id="grad-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#2ee6d0"/>
      <stop offset="100%" stop-color="#f5a200" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow sutil detrás del texto -->
    <radialGradient id="glow" cx="38%" cy="50%" r="40%">
      <stop offset="0%"  stop-color="#1d3a5e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo -->
  <rect width="900" height="280" fill="url(#bg-grad)" rx="12"/>
  <!-- Glow -->
  <rect width="900" height="280" fill="url(#glow)" rx="12"/>

  <!-- ======================== GRID DE CIRCUITOS (lado derecho) ======================== -->
  <!-- Trazos base estáticos -->
  <g class="circuit c-teal">
    <!-- Columna vertical derecha -->
    <line x1="700" y1="20"  x2="700" y2="260"/>
    <line x1="740" y1="40"  x2="740" y2="240"/>
    <line x1="780" y1="60"  x2="780" y2="220"/>
    <line x1="820" y1="20"  x2="820" y2="280"/>
    <line x1="860" y1="50"  x2="860" y2="230"/>
    <!-- Horizontales -->
    <line x1="660" y1="80"  x2="880" y2="80"/>
    <line x1="680" y1="120" x2="880" y2="120"/>
    <line x1="660" y1="160" x2="880" y2="160"/>
    <line x1="680" y1="200" x2="880" y2="200"/>
    <line x1="660" y1="240" x2="860" y2="240"/>
    <!-- Diagonales esquina superior -->
    <line x1="700" y1="80"  x2="740" y2="40"/>
    <line x1="780" y1="80"  x2="820" y2="40"/>
    <line x1="820" y1="160" x2="860" y2="120"/>
    <!-- Pequeños segmentos -->
    <line x1="700" y1="120" x2="720" y2="120"/>
    <line x1="740" y1="160" x2="780" y2="160"/>
    <line x1="820" y1="200" x2="860" y2="200"/>
  </g>
  <!-- Trazos gold -->
  <g class="circuit c-gold">
    <line x1="720" y1="60"  x2="760" y2="60"/>
    <line x1="760" y1="100" x2="800" y2="100"/>
    <line x1="800" y1="140" x2="840" y2="140"/>
    <line x1="760" y1="180" x2="800" y2="180"/>
    <line x1="720" y1="220" x2="760" y2="220"/>
    <line x1="760" y1="60"  x2="760" y2="180"/>
    <line x1="800" y1="100" x2="800" y2="180"/>
  </g>

  <!-- Pequeños puntos de circuito en intersecciones -->
  <g>
    <circle class="node"   cx="700" cy="80"  r="3"/>
    <circle class="node"   cx="740" cy="80"  r="2.5"/>
    <circle class="node"   cx="700" cy="120" r="2.5"/>
    <circle class="node"   cx="780" cy="160" r="3"/>
    <circle class="node"   cx="820" cy="120" r="2.5"/>
    <circle class="node-g" cx="760" cy="100" r="3"/>
    <circle class="node-g" cx="800" cy="140" r="2.5"/>
    <circle class="node"   cx="700" cy="160" r="2"/>
    <circle class="node"   cx="860" cy="200" r="3"/>
    <circle class="node-g" cx="820" cy="200" r="2"/>
    <circle class="node"   cx="780" cy="80"  r="2.5"/>
    <circle class="node"   cx="860" cy="80"  r="2"/>
  </g>

  <!-- ======================== PULSOS ANIMADOS ======================== -->
  <path class="pulse-1" d="M700 80 L740 80 L740 40 L820 40 L820 80 L860 80"/>
  <path class="pulse-2" d="M700 160 L780 160 L780 200 L860 200"/>
  <path class="pulse-3" d="M760 60 L760 100 L800 100 L800 140 L840 140"/>
  <path class="pulse-4" d="M680 120 L740 120 L780 80 L820 80 L860 120"/>
  <path class="pulse-5" d="M700 200 L720 200 L720 240 L820 240 L860 200"/>

  <!-- ======================== TEXTO HERO ======================== -->
  <g class="hero-text">
    <!-- Tagline superior -->
    <text x="48" y="88" class="tagline">Fullstack Developer · Co-fundadora de PineAipple</text>

    <!-- Nombre principal -->
    <text x="46" y="155" class="name">Alejandra<tspan class="accent"> Olazagasti</tspan></text>

    <!-- Línea decorativa bajo el nombre -->
    <line x1="46" y1="170" x2="306" y2="170" class="underline-bar"/>

    <!-- Descripción secundaria -->
    <text x="48" y="210" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#8b9dc3" letter-spacing="0.2px" font-style="italic">
      "Construyo productos digitales que no necesitan manual."
    </text>
  </g>
</svg>
